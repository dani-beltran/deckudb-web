name: Validation

on:
  workflow_call:
    inputs:
      skip_docker_build:
        description: Skip the Docker validation build when the caller publishes the image
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8 AM UTC
  workflow_dispatch: # Enables manual triggering of the workflow from the Actions tab

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_VERSION: '11.12.1'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      # Lifecycle scripts are disabled in .npmrc, so Nuxt preparation is explicit.
      - name: Prepare Nuxt
        run: npm exec -- nuxt prepare

      - name: Run linter
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache MongoDB binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-mongodb-binaries-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Set up npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt
        run: npm exec -- nuxt prepare

      # Hosted runners are ephemeral, so OS packages cannot be restored with the
      # browser cache and must be installed on every run.
      - name: Install Playwright system dependencies
        run: npm exec -- playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm exec -- playwright install chromium

      - name: Run test suite
        run: npm test

  build:
    name: Docker image
    if: ${{ !inputs.skip_docker_build }}
    needs:
      - static-analysis
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64
          load: true
          push: false
          tags: deckudb-web:ci
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image
