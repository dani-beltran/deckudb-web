name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request: # Triggers the workflow on any pull request
  workflow_dispatch: # Enables manual triggering of the workflow from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NODE_VERSION: '22'
  NPM_VERSION: '11.12.1'
  NUXT_TELEMETRY_DISABLED: '1'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      # Lifecycle scripts are disabled in .npmrc, so Nuxt preparation is explicit.
      - name: Prepare Nuxt
        run: npm exec -- nuxt prepare

      - name: Run linter
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache test binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-test-binaries-${{ hashFiles('package-lock.json') }}

      - name: Set up npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt
        run: npm exec -- nuxt prepare

      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Run test suite
        run: npm test

  build:
    name: Production image
    needs:
      - quality
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64
          load: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image
          provenance: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          sbom: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

      - name: Trigger cloud deployment
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created == true
        env:
          DEPLOYMENT_WEBHOOK_URL: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
        run: |
          if [[ -z "$DEPLOYMENT_WEBHOOK_URL" ]]; then
            echo '::error::The DEPLOYMENT_WEBHOOK_URL secret is not configured.'
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$DEPLOYMENT_WEBHOOK_URL"
